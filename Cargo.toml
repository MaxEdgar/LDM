[workspace]
resolver = "2"
members = [
    "crates/ldm-engine",
    "crates/ldm-test-server",
    "crates/ldm-cli",
    "crates/ldm-gui",
    "browser/native-host",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://example.invalid/ldm"
authors = ["LDM contributors"]

[workspace.dependencies]
ldm-engine = { path = "crates/ldm-engine" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "time", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
